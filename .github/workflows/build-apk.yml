name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare Web Dir & Build Android Project
        run: |
          mkdir -p www
          cp Alpna_Fruit_POS___8-Device_Mobile_Billing_App.html www/index.html
          sed -i 's/"webDir": "."/"webDir": "www"/g' capacitor.config.json
          npm install
          npx cap add android
          npx cap sync android
      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alpna-Fruit-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
